<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' ferd: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'">
  <title>Ferdaboka</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ STARTMENY ============ -->
  <section id="start" class="screen active">
    <div class="start-book">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <header class="start-head">
        <svg class="crest" viewBox="0 0 120 60" aria-hidden="true">
          <path d="M8 52 L34 18 L46 32 L62 8 L80 34 L90 24 L112 52" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M62 8 l-5 9 l5 -3 l5 3z M34 18 l-4 6 l4 -2 l4 2z" fill="currentColor"/>
          <path d="M66 18 l-6 14 M70 24 l-5 12 M74 29 l-4 9 M38 24 l-5 10 M42 28 l-3 7" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4 56 H116" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <h1>Ferdaboka</h1>
        <p class="tagline">Ei bok over vandringer, stier og fjell</p>
        <svg class="flourish" viewBox="0 0 400 24" aria-hidden="true">
          <path d="M10 12 H170 M230 12 H390" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <path d="M170 12 q15 -12 30 0 q15 12 30 0" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <circle cx="200" cy="12" r="3.5" fill="currentColor"/>
          <circle cx="10" cy="12" r="2" fill="currentColor"/><circle cx="390" cy="12" r="2" fill="currentColor"/>
        </svg>
      </header>
      <h2 class="section-title">Velg et kart</h2>
      <div id="mapGrid" class="map-grid"></div>
      <footer class="start-foot">
        <span id="totalStats"></span>
        <span class="foot-links">
          <span id="versionInfo"></span>
          <button class="link-btn" id="checkUpdateBtn">Se etter oppdateringer</button>
          <button class="link-btn" id="openDataBtn" title="Åpne mappa der turene og bildene dine er lagret">Åpne datamappe</button>
        </span>
      </footer>
    </div>
  </section>

  <!-- ============ KARTVISNING ============ -->
  <section id="mapScreen" class="screen">
    <header class="toolbar">
      <button class="tb-btn back" id="backBtn" title="Tilbake til kartboka">&#x2190; Kartboka</button>
      <h2 id="mapTitle" class="map-title"></h2>
      <div class="tool-group" role="group" aria-label="Verktøy">
        <button class="tb-btn tool" data-tool="pan" title="Flytt og velg (V)">
          <svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-7a1.5 1.5 0 0 1 3 0v7m0-6a1.5 1.5 0 0 1 3 0v7m0-4a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2a7 7 0 0 1-5.6-2.8L3.5 15.4a1.6 1.6 0 0 1 2.4-2.1L8 15"/></svg>
          <span>Flytt</span></button>
        <button class="tb-btn tool" data-tool="draw" title="Tegn tur (B)">
          <svg viewBox="0 0 24 24"><path d="M20 2c-6 2-11 7-13 13l2 2c6-2 11-7 13-13zM7 15l-3 7 7-3"/></svg>
          <span>Tegn</span></button>
        <button class="tb-btn tool" data-tool="erase" title="Viskelær (E)">
          <svg viewBox="0 0 24 24"><path d="M16 3l5 5-11 11H5l-3-3zM9 10l5 5M5 19h15"/></svg>
          <span>Visk</span></button>
      </div>
      <div class="tool-group">
        <button class="tb-btn icon" id="undoBtn" title="Angre (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-4"/></svg></button>
        <button class="tb-btn icon" id="redoBtn" title="Gjør om (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h4"/></svg></button>
      </div>
      <div class="tool-group ink">
        <div id="swatches" class="swatches"></div>
        <label class="width-ctl" title="Strektykkelse">
          <svg viewBox="0 0 24 24"><path d="M4 6h16" stroke-width="1"/><path d="M4 12h16" stroke-width="2.5"/><path d="M4 18h16" stroke-width="4"/></svg>
          <input type="range" id="widthRange" min="1" max="12" step="0.5" value="4">
        </label>
      </div>
      <div class="tool-group">
        <button class="tb-btn tool" data-tool="calibrate" title="Sett målestokk: klikk to punkter med kjent avstand">
          <svg viewBox="0 0 24 24"><path d="M3 17l14-14 4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/></svg>
          <span>Målestokk</span></button>
        <button class="tb-btn icon" id="zoomOut" title="Zoom ut (-)">&minus;</button>
        <button class="tb-btn icon" id="zoomFit" title="Vis hele kartet (0)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="tb-btn icon" id="zoomIn" title="Zoom inn (+)">+</button>
      </div>
    </header>

    <div class="map-body">
      <div id="viewport" class="viewport" data-tool="pan">
        <div id="stage" class="stage">
          <img id="mapImg" alt="" draggable="false">
          <svg id="overlay" class="overlay"></svg>
        </div>
        <div id="hint" class="hint"></div>
        <div id="tooltip" class="tooltip"></div>
        <div id="scaleBar" class="scale-bar"></div>
      </div>

      <aside id="sidebar" class="sidebar">
        <!-- Liste over turer -->
        <div id="tripListPanel" class="panel">
          <div class="panel-head">
            <h3>Turer</h3>
            <button class="btn primary" id="newTripBtn">+ Ny tur</button>
          </div>
          <div class="filters">
            <select id="catFilter" title="Filtrer på kategori"></select>
            <select id="sortSel" title="Sortering">
              <option value="date-desc">Nyeste først</option>
              <option value="date-asc">Eldste først</option>
              <option value="len-desc">Lengste først</option>
              <option value="title">Navn A–Å</option>
            </select>
          </div>
          <ul id="tripList" class="trip-list"></ul>
          <div id="listSummary" class="list-summary"></div>
        </div>

        <!-- Detaljer for valgt tur -->
        <div id="tripDetailPanel" class="panel hidden">
          <div class="panel-head">
            <button class="link-btn" id="closeDetailBtn">&#x2190; Alle turer</button>
            <span id="tripLength" class="trip-length"></span>
          </div>
          <input id="tripTitle" class="title-input" placeholder="Navn på turen" maxlength="80">
          <div class="row">
            <label>Dato<input type="date" id="tripDate"></label>
            <label>Kategori<select id="tripCat"></select></label>
          </div>
          <div class="row">
            <label>Strek<select id="tripDash">
              <option value="solid">Heltrukken</option>
              <option value="dash">Stiplet</option>
              <option value="dot">Prikket</option>
            </select></label>
            <label>Farge<input type="color" id="tripColor"></label>
            <label>Tykkelse<input type="range" id="tripWidth" min="1" max="12" step="0.5"></label>
          </div>
          <label class="block">Beskrivelse
            <textarea id="tripDesc" rows="8" placeholder="Hvordan var turen? Vær, følge, utsikt, hva dere så underveis …"></textarea>
          </label>
          <div class="photos-head">
            <span>Bilder</span>
            <button class="btn" id="addPhotosBtn">+ Legg til bilder</button>
          </div>
          <div id="photoGrid" class="photo-grid"></div>
          <div class="detail-actions">
            <button class="btn" id="drawMoreBtn">Tegn mer på turen</button>
            <button class="btn danger" id="deleteTripBtn">Slett tur</button>
          </div>
        </div>
      </aside>
    </div>
  </section>

  <!-- ============ DIALOGER ============ -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <button class="lb-close" id="lbClose" title="Lukk (Esc)">&times;</button>
    <button class="lb-nav prev" id="lbPrev" title="Forrige">&#x2039;</button>
    <img id="lbImg" alt="">
    <button class="lb-nav next" id="lbNext" title="Neste">&#x203A;</button>
    <div class="lb-count" id="lbCount"></div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="updateBanner" class="update-banner hidden">
    <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>
    <span id="updateText"></span>
    <button class="btn primary" id="updateNowBtn">Start på nytt og oppdater</button>
    <button class="link-btn" id="updateLaterBtn">Senere</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
