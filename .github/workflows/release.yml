# Bygger Ferdaboka på Windows og publiserer en GitHub Release når en versjons-tag (v1.2.3) lastes opp.
# Installerte apper finner den nye versjonen via latest.yml i releasen.
name: Bygg og publiser

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Sjekk at versjonen i package.json stemmer med taggen
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "package.json har $V, men taggen er ${GITHUB_REF_NAME}"; exit 1; }

      - name: Sørg for at NSIS er installert
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Bygg installer
        run: node tools/build-win.js

      - name: Publiser release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          [ -s notes.md ] || echo "Ferdaboka ${GITHUB_REF_NAME#v}" > notes.md
          gh release create "${GITHUB_REF_NAME}" --title "Ferdaboka ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            "dist/Ferdaboka-Setup-${GITHUB_REF_NAME#v}.exe" dist/latest.yml

      - name: Last opp som artefakt (manuell kjøring)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ferdaboka-installer
          path: |
            dist/*.exe
            dist/latest.yml
