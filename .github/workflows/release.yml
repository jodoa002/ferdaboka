# Bygger Ferdaboka på Windows og publiserer versjonen i package.json som GitHub Release.
# Start den under «Actions» → «Bygg og publiser» → «Run workflow» (eller ved å laste opp en tag v1.2.3).
# Endringsnotatet hentes fra RELEASE_NOTES.md. Installerte apper finner den nye versjonen via latest.yml.
name: Bygg og publiser

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Finn versjon
        id: v
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Versjon $V er allerede publisert. Øk versjonen i package.json først."; exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sørg for at NSIS er installert
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Bygg installer
        run: node tools/build-win.js

      - name: Publiser release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          [ -s RELEASE_NOTES.md ] && cp RELEASE_NOTES.md notes.md || echo "Ferdaboka $V" > notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "Ferdaboka $V" --notes-file notes.md \
            "dist/Ferdaboka-Setup-$V.exe" dist/latest.yml
